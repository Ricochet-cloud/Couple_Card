<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>도전과제 - 추억카드뽑기</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/card.css">
  <link rel="stylesheet" href="./css/achievements.css">
  <link rel="stylesheet" href="./css/audio.css">
</head>
<body>
  <div class="main-container">
    <header class="header">
      <h1>추억카드뽑기</h1>
      <button id="logoutBtn" class="logout-btn">로그아웃</button>
    </header>

    <main>
      <div class="ach-summary" id="achSummary">
        <div class="ach-summary__main">🏆 도전과제</div>
        <div class="ach-summary__sub">불러오는 중...</div>
      </div>

      <div class="ach-message" id="achMessage" style="display: none;"></div>

      <div class="ach-list" id="achList"></div>
    </main>
  </div>

  <!-- 하단 탭 네비 -->
  <nav class="bottom-nav">
    <a href="./index.html" class="nav-item" data-page="home">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">홈</span>
    </a>
    <a href="./collection.html" class="nav-item" data-page="collection">
      <span class="nav-icon">📖</span>
      <span class="nav-label">도감</span>
    </a>
    <a href="./recombine.html" class="nav-item" data-page="recombine">
      <span class="nav-icon">✨</span>
      <span class="nav-label">재조합</span>
    </a>
    <a href="./achievements.html" class="nav-item active" data-page="achievements">
      <span class="nav-icon">🏆</span>
      <span class="nav-label">도전과제</span>
    </a>
    <a href="./admin.html" class="nav-item" id="adminNav" style="display: none;" data-page="admin">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">관리</span>
    </a>
  </nav>

  <!-- 보상 카드 공개 -->
  <div class="ach-modal" id="achModal" role="dialog" aria-modal="true">
    <div class="ach-modal__box">
      <div class="ach-modal__title" id="achModalTitle">🏆 도전과제 달성!</div>
      <div class="ach-modal__card" id="achModalCard"></div>
      <div class="ach-modal__info" id="achModalInfo"></div>
      <button class="ach-claim" id="achModalClose" type="button">확인</button>
    </div>
  </div>

  <script type="module">
    import { initAuth, isAdmin, logout, guardAuth } from './js/auth.js';
    import { renderCard, RARITY, formatDexNo } from './js/card.js';
    import { initTilt } from './js/tilt.js';
    import { ACHIEVEMENTS } from './js/achievements-list.js';
    import {
      loadAchievementData,
      evaluateAchievement,
      findRewardCard,
      claimAchievement,
    } from './js/achievements.js';

    let data = null;

    function escapeHtml(str) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      return String(str).replace(/[&<>"']/g, (c) => map[c]);
    }

    const fmt = (n) => Number(n).toLocaleString('ko-KR');

    function showMessage(text) {
      const el = document.getElementById('achMessage');
      el.textContent = text;
      el.style.display = text ? 'block' : 'none';
    }

    // ========== 초기화 ==========
    initAuth(() => {
      guardAuth();

      if (isAdmin()) {
        document.getElementById('adminNav').style.display = 'flex';
      }

      init();
    });

    async function init() {
      try {
        data = await loadAchievementData();
        render();
      } catch (error) {
        console.error('도전과제 불러오기 실패:', error);
        document.getElementById('achSummary').querySelector('.ach-summary__sub').textContent = '';
        showMessage('도전과제를 불러오지 못했어요: ' + error.message);
      }
    }

    // ========== 화면 그리기 ==========
    function render() {
      let claimedCount = 0;
      let readyCount = 0;

      const itemsHtml = ACHIEVEMENTS.map((ach) => {
        const status = evaluateAchievement(ach, data);
        const claimedDate = data.claimed[ach.id] || null;
        const reward = findRewardCard(ach, data);
        const isSecret = ach.secret && !status.done && !claimedDate;
        const isReady = status.done && !claimedDate;

        if (claimedDate) claimedCount++;
        if (isReady && reward) readyCount++;

        const pct = Math.min(100, Math.floor((status.current / status.target) * 100));
        const rewardLabel = reward
          ? `${escapeHtml(RARITY[reward.rarity]?.label || '')} 카드`
          : '준비 중';

        let actionHtml = '';
        if (claimedDate) {
          actionHtml = `<div class="ach-claimed">✔ 수령 완료 · ${escapeHtml(claimedDate)}</div>`;
        } else if (isReady && reward) {
          actionHtml = `<button class="ach-claim" type="button" data-claim="${escapeHtml(ach.id)}">보상 받기</button>`;
        } else if (isReady) {
          actionHtml = `<button class="ach-claim" type="button" disabled>보상 준비 중</button>`;
        }

        const stateClass = claimedDate ? 'is-claimed' : isReady ? 'is-ready' : isSecret ? 'is-secret' : '';

        return `<article class="ach-item ${stateClass}">
          <div class="ach-icon">${isSecret ? '❔' : escapeHtml(ach.icon)}</div>
          <div class="ach-body">
            <h3 class="ach-title">${isSecret ? '???' : escapeHtml(ach.title)}</h3>
            <p class="ach-desc">${isSecret ? '비밀 도전과제예요. 달성하면 공개돼요.' : escapeHtml(ach.description)}</p>
            ${
              isSecret
                ? ''
                : `<div class="ach-progress" role="progressbar" aria-valuemin="0" aria-valuemax="${status.target}" aria-valuenow="${status.current}">
                     <div class="ach-progress__fill" style="width: ${pct}%"></div>
                   </div>
                   <div class="ach-progress__text">${fmt(status.current)} / ${fmt(status.target)}</div>`
            }
            <div class="ach-reward">🎁 보상: ${isSecret ? '???' : rewardLabel}</div>
            ${actionHtml}
          </div>
        </article>`;
      }).join('');

      document.getElementById('achList').innerHTML =
        ACHIEVEMENTS.length === 0
          ? '<div class="ach-empty">아직 등록된 도전과제가 없어요</div>'
          : itemsHtml;

      document.getElementById('achSummary').innerHTML = `
        <div class="ach-summary__main">🏆 수령 완료 ${claimedCount} / ${ACHIEVEMENTS.length}</div>
        <div class="ach-summary__sub">${
          readyCount > 0
            ? `<span class="ach-summary__ready">받을 수 있는 보상이 ${readyCount}개 있어요!</span>`
            : '조건을 달성하면 특별한 카드를 받을 수 있어요'
        }</div>`;
    }

    // ========== 보상 받기 ==========
    document.getElementById('achList').addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-claim]');
      if (!btn) return;

      btn.disabled = true;
      btn.textContent = '받는 중...';
      showMessage('');

      try {
        const result = await claimAchievement(btn.dataset.claim);
        data = await loadAchievementData();
        render();
        openRevealModal(result);
      } catch (error) {
        console.error('보상 받기 실패:', error);
        showMessage('보상을 받지 못했어요: ' + error.message);
        data = await loadAchievementData().catch(() => data);
        render();
      }
    });

    function openRevealModal({ card, isFirstTime }) {
      const label = RARITY[card.rarity]?.label || '';
      document.getElementById('achModalTitle').textContent = `🏆 ${label} 카드 획득!`;
      document.getElementById('achModalCard').innerHTML = renderCard(card);
      document.getElementById('achModalInfo').innerHTML = `
        ${escapeHtml(formatDexNo(card.dexNo))} ${escapeHtml(card.title)}<br>
        ${isFirstTime ? '처음 획득!' : `보유 ${card.count}장`}`;
      initTilt(document.querySelector('#achModalCard .card'));
      document.getElementById('achModal').classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    function closeRevealModal() {
      document.getElementById('achModal').classList.remove('show');
      document.body.style.overflow = '';
    }

    document.getElementById('achModalClose').addEventListener('click', closeRevealModal);

    // ========== 로그아웃 ==========
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try {
        await logout();
        window.location.href = './login.html';
      } catch (error) {
        alert('로그아웃 실패: ' + error.message);
      }
    });
  </script>
<script src="./js/audio.js"></script>
</body>
</html>
