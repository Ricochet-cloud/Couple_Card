<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>JUMP & SURVIVE</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e0b14; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    width: min(100vw, 177.78vh); height: auto; aspect-ratio: 16 / 9;
    image-rendering: pixelated; touch-action: none; display: block;
    box-shadow: 0 0 40px rgba(0,0,0,.6);
  }
</style>
</head>
<body>
<canvas id="c" width="800" height="450"></canvas>
<!-- prepare_assets.py 가 만들어 주는 파일. 없어도 게임은 기본 도형으로 실행돼요 -->
<script src="assets/frames.js" onerror="void 0"></script>
<script>
// ===== 난이도 설정 =====
const DIFFICULTIES = {
  EASY: {
    duration: 50,
    gravity: 1850,
    jumpV: 800,
    baseSpeed: 280,
    speedUp: 3.2,
    spawnStart: 1.6,
    spawnMin: 0.8,
    fairMargin: 0.25
  },
  NORMAL: {
    duration: 60,
    gravity: 2100,
    jumpV: 760,
    baseSpeed: 330,
    speedUp: 4.5,
    spawnStart: 1.25,
    spawnMin: 0.6,
    fairMargin: 0.15
  },
  HARD: {
    duration: 70,
    gravity: 2300,
    jumpV: 720,
    baseSpeed: 380,
    speedUp: 5.5,
    spawnStart: 1.0,
    spawnMin: 0.45,
    fairMargin: 0.10
  }
};

// 기본값은 NORMAL, 주소(?d=HARD) 또는 iframe 메시지로 바꿀 수 있음
let currentDifficulty = 'NORMAL';
let best = 0;   // 난이도별 최고 기록 (저장 키: js_best_난이도)
function loadBest() {
  best = 0;
  try { best = parseFloat(localStorage.getItem('js_best_' + currentDifficulty)) || 0; } catch (e) {}
}
function saveBest() {
  try { localStorage.setItem('js_best_' + currentDifficulty, best); } catch (e) {}
}
let DURATION, GRAVITY, JUMP_V, BASE_SPEED, SPEED_UP, SPAWN_START, SPAWN_MIN, FAIR_MARGIN;

function applyDifficulty(difficulty) {
  const diff = DIFFICULTIES[difficulty] || DIFFICULTIES.NORMAL;
  DURATION = diff.duration;
  GRAVITY = diff.gravity;
  JUMP_V = diff.jumpV;
  BASE_SPEED = diff.baseSpeed;
  SPEED_UP = diff.speedUp;
  SPAWN_START = diff.spawnStart;
  SPAWN_MIN = diff.spawnMin;
  FAIR_MARGIN = diff.fairMargin;
  currentDifficulty = DIFFICULTIES[difficulty] ? difficulty : 'NORMAL';
  loadBest();
}

// iframe으로부터 메시지 받을 때 난이도 변경
// 같은 사이트(같은 origin)의 부모 페이지가 보낸 메시지만 받아요.
let externalPlayerId = null;
let externalPlayerName = null;

function handleIframeMessage(event) {
  if (event.source !== window.parent || event.origin !== location.origin) return;
  const msg = event.data;
  if (!msg || typeof msg !== 'object') return;
  if (state === 'play') return;   // 플레이 도중에는 난이도를 바꾸지 않아요
  if (msg.type === 'gameConfig' && DIFFICULTIES[msg.difficulty]) {
    applyDifficulty(msg.difficulty);
    if (msg.playerId) externalPlayerId = msg.playerId;
    if (msg.playerName) externalPlayerName = msg.playerName;
  }
}
window.addEventListener('message', handleIframeMessage);

// 초기 난이도: 주소의 ?d=EASY | NORMAL | HARD (없거나 틀리면 NORMAL)
const queryDifficulty = (new URLSearchParams(location.search).get('d') || '').toUpperCase();
applyDifficulty(queryDifficulty);

// ===== 기본 세팅 =====
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = cv.width, H = cv.height;
const GROUND = 405;   // 발이 닿는 높이 (배경 길바닥 기준)
const PX = 150;       // 플레이어 x 고정
const BOSS_X = 700;   // 적 x 고정

// ===== 에셋 로딩 (실패하면 기본 도형으로 대체) =====
const A = {};
(function loadAssets() {
  const defs = window.ASSETS || {};
  for (const k in defs) {
    const d = defs[k];
    const obj = typeof d === 'string' ? {} : d;
    const img = new Image();
    img.onload = () => { A[k] = Object.assign({ img }, obj); };
    img.onerror = () => console.warn('에셋 로드 실패:', k);
    img.src = typeof d === 'string' ? d : d.src;
  }
})();
// 스트립에서 f번째 프레임을 그림 (발 기준: bottom)
function sprite(a, f, cx, bottom) {
  ctx.drawImage(a.img, f * a.w, 0, a.w, a.h, Math.round(cx - a.w / 2), Math.round(bottom - a.h), a.w, a.h);
}
// 중심 기준
function spriteC(a, f, cx, cy) {
  ctx.drawImage(a.img, f * a.w, 0, a.w, a.h, Math.round(cx - a.w / 2), Math.round(cy - a.h / 2), a.w, a.h);
}

let state = 'ready';
let t, player, shots, boss, spawnTimer, scroll, particles, shake;

function reset() {
  t = 0; scroll = 0; spawnTimer = 1.0; shake = 0;
  player = { y: GROUND - 58, vy: 0, w: 26, h: 58, onGround: true, holding: false };
  shots = []; particles = [];
  boss = { x: BOSS_X, throw: 0 };
}
reset();

// ===== 입력 =====
let endAt = 0;
function press() {
  if (state === 'ready' || state === 'dead' || state === 'win') {
    if (state !== 'ready' && Date.now() - endAt < 400) return;
    reset(); state = 'play'; return;
  }
  if (player.onGround) {
    player.vy = -JUMP_V; player.onGround = false; player.holding = true;
    burst(PX, GROUND, 5, '#c9b8ff');
  }
}
function release() { player.holding = false; }
addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); if (!e.repeat) press(); }
  if (e.code === 'KeyR') { reset(); state = 'play'; }
});
addEventListener('keyup', e => { if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) release(); });
cv.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
addEventListener('pointerup', release);

// ===== 유틸 =====
function burst(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    particles.push({ x, y, vx: (Math.random() - .5) * 220, vy: -Math.random() * 200,
      life: .4 + Math.random() * .3, color });
  }
}
const rnd = (a, b) => a + Math.random() * (b - a);

// ===== 투사체 생성 =====
// 공정성 규칙: 점프로 피해야 하는 투사체(낫) 뒤에는, 착지해서 다시 뛸 시간이 있을 만큼 간격을 둬요.
//   낫(low/lob) → 다음 투사체: 점프 체공시간 + fairMargin 초 이상 간격
//   참격(high)  → 다음 투사체: 0.3초 이상 간격 (서서 피하니까 짧아도 돼요)
// 간격이 모자라면 이번 투사체는 만들지 않고 잠깐 뒤 다시 시도해요.
function gapNeeded(firstKind) {
  return firstKind === 'high' ? 0.3 : (2 * JUMP_V) / GRAVITY + FAIR_MARGIN;
}
function isFair(kind, arrive) {
  for (const s of shots) {
    if (s.arrive < t - 0.3) continue;           // 이미 지나간 투사체
    const d = arrive - s.arrive;                  // 플레이어에게 도착하는 시각 차이
    const need = d >= 0 ? gapNeeded(s.type) : gapNeeded(kind);
    if (Math.abs(d) < need) return false;
  }
  return true;
}

// 만들었으면 true, 간격이 부족해서 건너뛰었으면 false
function spawn() {
  const speed = BASE_SPEED + t * SPEED_UP;
  const hx = boss.x - 50;
  const r = Math.random();
  const lobChance = t > 8 ? 0.3 : 0;
  const highChance = t > 4 ? 0.28 : 0;
  const kind = r < lobChance ? 'lob' : r < lobChance + highChance ? 'high' : 'low';
  const T = kind === 'lob' ? rnd(0.85, 1.1) : 0;     // 포물선 낫이 플레이어 근처에 떨어지기까지 시간
  const travel = kind === 'lob' ? T : (hx - PX) / (kind === 'high' ? speed * 1.05 : speed);
  const arrive = t + travel;
  if (!isFair(kind, arrive)) return false;

  let ey;
  if (kind === 'lob') {
    // 포물선 낫: 플레이어 근처 바닥으로 떨어짐 -> 점프로 넘겨야 함
    ey = GROUND - 130;
    const targetX = PX + rnd(-10, 40);
    const targetY = GROUND - 16;
    const vx = (targetX - hx) / T;
    const g = 1100;
    const vy = (targetY - ey - 0.5 * g * T * T) / T;
    shots.push({ type: 'lob', x: hx, y: ey, vx, vy, g, r: 16, cxo: 0, arrive });
  } else if (kind === 'high') {
    // 높은 참격: 서 있으면 지나감, 점프하면 맞음
    ey = GROUND - 100;
    shots.push({ type: 'high', x: hx, y: ey, vx: -speed * 1.05, vy: 0, g: 0, r: 16, cxo: -12, arrive });
  } else {
    // 바닥 낫: 점프로 넘기
    ey = GROUND - 22;
    shots.push({ type: 'low', x: hx, y: ey, vx: -speed, vy: 0, g: 0, r: 16, cxo: 0, arrive });
  }
  boss.throw = 0.36;
  burst(hx, ey, 4, '#ff6b81');
  return true;
}

// ===== 업데이트 =====
function update(dt) {
  scroll += (260 + t * 3) * dt;
  boss.throw = Math.max(0, boss.throw - dt);

  if (state === 'play') {
    t += dt;
    // 플레이어
    player.vy += GRAVITY * dt;
    // 점프 버튼 일찍 떼면 낮게 점프
    if (!player.holding && player.vy < -300) player.vy += GRAVITY * 1.6 * dt;
    player.y += player.vy * dt;
    if (player.y >= GROUND - player.h) {
      if (!player.onGround) burst(PX, GROUND, 4, '#c9b8ff');
      player.y = GROUND - player.h; player.vy = 0; player.onGround = true;
    }

    // 스폰
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      if (spawn()) {
        const interval = Math.max(SPAWN_MIN, SPAWN_START - t * 0.011);
        spawnTimer = interval * rnd(0.9, 1.25);
      } else {
        spawnTimer = 0.05;   // 간격이 모자라서 건너뜀 → 곧 다시 시도
      }
    }

    // 투사체
    for (const s of shots) {
      s.vy += s.g * dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.type === 'lob' && s.y > GROUND - s.r && s.vy > 0) {
        s.y = GROUND - s.r; s.vy *= -0.35; s.vx *= 0.8;
        burst(s.x, GROUND, 3, '#ffb36b');
      }
    }
    shots = shots.filter(s => s.x > -60);

    // 충돌 (살짝 너그럽게)
    const px = PX - player.w / 2 + 3, pw = player.w - 6;
    const py = player.y + 4, ph = player.h - 6;
    for (const s of shots) {
      const hr = s.r - 3;
      const sx = s.x + (s.cxo || 0);
      const cx = Math.max(px, Math.min(sx, px + pw));
      const cy = Math.max(py, Math.min(s.y, py + ph));
      if ((sx - cx) ** 2 + (s.y - cy) ** 2 < hr * hr) { die(); break; }
    }

    if (t >= DURATION) win();
  }

  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  if (shake > 0) shake -= dt;
}

function die() {
  state = 'dead'; endAt = Date.now(); shake = .3;
  burst(PX, player.y + 30, 24, '#ff6b81');
  if (t > best) { best = t; saveBest(); }
  sendGameResult(false);
}
function win() {
  state = 'win'; endAt = Date.now(); t = DURATION;
  best = DURATION; saveBest();
  for (let i = 0; i < 40; i++) burst(rnd(100, 700), rnd(50, 250), 1, ['#ffd166', '#06d6a0', '#ef476f', '#8ecae6'][i % 4]);
  sendGameResult(true);
}

function sendGameResult(isWin) {
  const result = {
    type: 'gameResult',
    playerId: externalPlayerId,
    playerName: externalPlayerName,
    difficulty: currentDifficulty,
    survived: t,
    duration: DURATION,
    isWin: isWin,
    timestamp: Date.now()
  };
  // iframe 모드일 때만 부모에게 전송 (단독 실행 모드에서는 무해함)
  if (window.parent !== window) {
    // file:// 로 열면 origin 이 'null' 이라 대상 지정이 안 돼서 '*' 를 써요
    window.parent.postMessage(result, location.origin === 'null' ? '*' : location.origin);
  }
}

// ===== 그리기: 배경 =====
function drawBG() {
  if (A.bg) {
    // 한 장짜리 배경을 좌우 반전해서 번갈아 이어 붙임 -> 이음새 없이 무한 스크롤
    const sc = scroll * 0.7;
    const k = Math.floor(sc / W), o = sc - k * W;
    for (let i = 0; i < 2; i++) {
      const x = i * W - o;
      if ((k + i) % 2 === 0) {
        ctx.drawImage(A.bg.img, Math.round(x), 0, W, H);
      } else {
        ctx.save(); ctx.translate(Math.round(x) + W, 0); ctx.scale(-1, 1);
        ctx.drawImage(A.bg.img, 0, 0, W, H); ctx.restore();
      }
    }
    // 탄이 잘 보이도록 살짝 어둡게
    ctx.fillStyle = 'rgba(8,4,24,0.18)'; ctx.fillRect(0, 0, W, H);
    return;
  }
  // 에셋이 없을 때 기본 배경
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1b1233'); g.addColorStop(1, '#4a2c5e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#f4e9c8'; ctx.beginPath(); ctx.arc(640, 90, 34, 0, 7); ctx.fill();
  for (let layer = 0; layer < 2; layer++) {
    const sp = layer ? 0.35 : 0.15, base = layer ? GROUND - 20 : GROUND - 50;
    ctx.fillStyle = layer ? '#2a1a40' : '#231638';
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 40; x += 40) {
      const wx = x + scroll * sp;
      const h = 50 + Math.sin(wx * 0.012 + layer * 2) * 28 + Math.sin(wx * 0.031) * 14;
      ctx.lineTo(x, base - h * (layer ? .6 : 1));
    }
    ctx.lineTo(W, H); ctx.fill();
  }
  ctx.fillStyle = '#2b1d3d'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#7a5aa6'; ctx.fillRect(0, GROUND, W, 4);
  ctx.fillStyle = '#3d2a57';
  const off = scroll % 60;
  for (let x = -off; x < W; x += 60) ctx.fillRect(x, GROUND + 22, 30, 4);
}

// ===== 그리기: 플레이어 (텐겐 스프라이트 / 없으면 도형) =====
// 프레임 순서: 0~3 달리기, 4 점프(상승), 5 낙하, 6 피격
function drawPlayer() {
  const a = A.tengen;
  if (a && a.n >= 7) {
    let f;
    if (state === 'dead') f = 6;
    else if (!player.onGround) f = player.vy < 0 ? 4 : 5;
    else f = Math.floor(performance.now() / 75) % 4;
    sprite(a, f, PX, player.y + player.h + 4);
    return;
  }
  const x = PX - player.w / 2, y = player.y + player.h - 36;
  const run = Math.floor(performance.now() / 90) % 2;
  ctx.fillStyle = '#e8e0ff'; ctx.fillRect(x + 3, y, 16, 16);
  ctx.fillStyle = '#ff6b81'; ctx.fillRect(x + 1, y - 2, 20, 5);
  ctx.fillStyle = '#1b1233'; ctx.fillRect(x + 13, y + 6, 4, 4);
  ctx.fillStyle = '#6c5ce7'; ctx.fillRect(x + 2, y + 16, 18, 12);
  ctx.fillStyle = '#e8e0ff';
  if (player.onGround) {
    ctx.fillRect(x + (run ? 3 : 11), y + 28, 7, 8);
    ctx.fillRect(x + (run ? 12 : 4), y + 28, 7, 8 - (run ? 0 : 2));
  } else {
    ctx.fillRect(x + 3, y + 28, 7, 6); ctx.fillRect(x + 12, y + 28, 7, 6);
  }
}

// ===== 그리기: 적 (규타로 스프라이트 / 없으면 도형) =====
// 프레임 순서: 0~1 대기, 2 낫 들어올림, 3~4 던지기
function drawBoss() {
  const a = A.gyutaro;
  if (a && a.n >= 5) {
    let f = Math.floor(performance.now() / 350) % 2;
    if (boss.throw > 0.24) f = 2;
    else if (boss.throw > 0.12) f = 3;
    else if (boss.throw > 0) f = 4;
    sprite(a, f, boss.x, GROUND + 6);
    return;
  }
  const y = GROUND - 70 + Math.sin(performance.now() / 500) * 10, x = boss.x;
  ctx.fillStyle = '#ff6b81'; ctx.fillRect(x - 24, y - 24, 48, 48);
  ctx.fillStyle = '#c0392b'; ctx.fillRect(x - 24, y + 14, 48, 10);
  ctx.fillStyle = '#fff';    ctx.fillRect(x - 15, y - 10, 12, 12); ctx.fillRect(x + 3, y - 10, 12, 12);
  ctx.fillStyle = '#1b1233'; ctx.fillRect(x - 12, y - 6, 5, 7); ctx.fillRect(x + 7, y - 6, 5, 7);
}

// ===== 그리기: 투사체 (낫 스프라이트 / 없으면 도형) =====
function drawShot(s) {
  const sp = s.type === 'high' ? A.wave : A.spin;
  if (sp) {
    const rate = s.type === 'lob' ? 18 : 14; // 초당 프레임 수
    const f = Math.floor(performance.now() / 1000 * rate) % sp.n;
    ctx.save();
    ctx.shadowColor = 'rgba(255,255,255,.55)'; ctx.shadowBlur = 8; // 배경에 묻히지 않게 은은한 테두리 빛
    spriteC(sp, f, s.x, s.y);
    ctx.restore();
    return;
  }
  const col = s.type === 'low' ? '#ffd166' : s.type === 'high' ? '#4dd2ff' : '#ff9f43';
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
  ctx.fillStyle = col + '66'; ctx.fillRect(s.x + s.r, s.y - 3, 26, 6);
}

function text(str, x, y, size, color, align = 'center') {
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.textAlign = align; ctx.fillStyle = '#000a'; ctx.fillText(str, x + 2, y + 2);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(rnd(-5, 5), rnd(-5, 5));
  drawBG();
  drawBoss();
  shots.forEach(drawShot);
  if (state !== 'dead' || A.tengen) drawPlayer();
  for (const p of particles) { ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 4, 4); }
  ctx.restore();

  // HUD: 남은 시간 바
  const remain = Math.max(0, DURATION - t);
  ctx.fillStyle = '#0008'; ctx.fillRect(20, 20, W - 40, 14);
  ctx.fillStyle = '#06d6a0'; ctx.fillRect(20, 20, (W - 40) * Math.min(1, t / DURATION), 14);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(20, 20, W - 40, 14);
  text(remain.toFixed(1) + 's', W / 2, 62, 26, '#fff');
  text('BEST ' + best.toFixed(1) + 's', W - 24, 62, 14, '#c9b8ff', 'right');
  text(currentDifficulty, 24, 62, 14, '#ffd166', 'left');

  if (state === 'ready') {
    ctx.fillStyle = '#000a'; ctx.fillRect(0, 0, W, H);
    text('JUMP & SURVIVE', W / 2, 160, 48, '#ffd166');
    text(`${DURATION}초 동안 살아남으세요! 한 대 맞으면 끝`, W / 2, 210, 18, '#fff');
    text('스페이스 / ↑ / 화면 터치 = 점프 (길게 누르면 높이)', W / 2, 245, 15, '#c9b8ff');
    text('날아오는 낫 = 점프로 넘기  |  높은 참격 = 점프하지 말고 서서 피하기', W / 2, 272, 15, '#c9b8ff');
    text('▶ 아무 키나 눌러서 시작', W / 2, 330, 22, '#fff');
  } else if (state === 'dead') {
    ctx.fillStyle = '#000a'; ctx.fillRect(0, 0, W, H);
    drawPlayerOverlay();
    text('GAME OVER', W / 2, 170, 52, '#ff6b81');
    text(`${t.toFixed(1)}초 생존 / ${DURATION}초`, W / 2, 220, 24, '#fff');
    text('스페이스 / 터치로 다시 도전 (R)', W / 2, 290, 18, '#c9b8ff');
  } else if (state === 'win') {
    ctx.fillStyle = '#000a'; ctx.fillRect(0, 0, W, H);
    text('SURVIVED!', W / 2, 170, 56, '#06d6a0');
    text(`${DURATION}초 버텨냈어요 🎉`, W / 2, 220, 24, '#fff');
    text('스페이스 / 터치로 다시 하기', W / 2, 290, 18, '#c9b8ff');
  }
}
// 게임 오버 화면에서도 쓰러진 캐릭터가 어둠 위로 보이게
function drawPlayerOverlay() { if (A.tengen) drawPlayer(); }

// ===== 루프 =====
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
