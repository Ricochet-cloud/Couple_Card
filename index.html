<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>홈 - 추억카드뽑기</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/card.css">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/index.css">
  <link rel="stylesheet" href="./css/audio.css">
</head>
<body>
  <div class="main-container">
    <header class="header">
      <h1>🌾 추억카드뽑기</h1>
      <button id="logoutBtn" class="logout-btn">로그아웃</button>
    </header>

    <main>
      <!-- 뽑기권 -->
      <div class="home-section">
        <div class="tickets-display">
          <div class="ticket-icon">🎟️</div>
          <div class="ticket-info">
            <div class="ticket-label">보유 뽑기권</div>
            <div class="ticket-count" id="ticketCount">0</div>
          </div>
        </div>

        <button class="draw-button" id="drawBtn">뽑기</button>
        <div class="draw-message" id="drawMessage"></div>
      </div>

      <!-- 방명록 -->
      <div class="home-section">
        <h2>💌 오늘의 방명록</h2>
        <div class="guestbook-section">
          <form class="guestbook-form" id="guestbookForm">
            <div class="guestbook-form-row">
              <input type="text" class="guestbook-nick" id="guestbookNick" maxlength="10" placeholder="닉네임" autocomplete="off">
              <span class="guestbook-count" id="guestbookCount">0/100</span>
            </div>
            <textarea id="guestbookText" maxlength="100" placeholder="오늘의 한마디를 남겨요 (100자)"></textarea>
            <button type="submit" class="guestbook-submit" id="guestbookSubmit">남기기</button>
          </form>
          <div class="guestbook-list" id="guestbookList">
            <div class="loading">로딩 중...</div>
          </div>
          <div class="guestbook-hint">방명록은 하루가 지나면 사라져요</div>
        </div>
      </div>

      <!-- 최근 획득 -->
      <div class="home-section">
        <h2>✨ 최근 획득</h2>
        <div class="recent-cards" id="recentCards">
          <div class="recent-empty">아직 뽑은 카드가 없습니다</div>
        </div>
      </div>

      <!-- 미니게임 -->
      <div class="home-section">
        <h2>🎮 미니게임</h2>
        <button class="minigame-button" onclick="goMinigame()">미니게임 시작</button>
        <div class="minigame-message" style="font-size: 11px; color: var(--text-muted); margin-top: 8px; font-family: 'Galmuri';">
          2분 동안 점수를 내고 뽑기권 받기
        </div>
      </div>

      <!-- 오늘의 미션 -->
      <div class="home-section">
        <h2>📝 오늘의 미션</h2>
        <div class="mission-section" id="missionSection">
          <div class="loading">로딩 중...</div>
        </div>
      </div>

      <!-- 오늘의 퀴즈 -->
      <div class="home-section">
        <h2>❓ 오늘의 퀴즈</h2>
        <div class="quiz-section" id="quizSection">
          <div class="loading">로딩 중...</div>
        </div>
      </div>
    </main>
  </div>

  <!-- 하단 탭 네비 -->
  <nav class="bottom-nav">
    <a href="./index.html" class="nav-item active" data-page="home">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">홈</span>
    </a>
    <a href="./collection.html" class="nav-item" data-page="collection">
      <span class="nav-icon">📖</span>
      <span class="nav-label">도감</span>
    </a>
    <a href="./recombine.html" class="nav-item" data-page="recombine">
      <span class="nav-icon">✨</span>
      <span class="nav-label">재조합</span>
    </a>
    <a href="./admin.html" class="nav-item" id="adminNav" style="display: none;" data-page="admin">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">관리</span>
    </a>
  </nav>

  <script type="module">
    import { initAuth, isAdmin, logout } from './js/auth.js';
    import { guardAuth } from './js/auth.js';
    import { grantDailyTicketIfNeeded, getTickets } from './js/ticket.js';
    import { getActiveCards } from './js/gacha.js';
    import { renderCard } from './js/card.js';
    import { getCollectionData } from './js/collection.js';
    import { assignOrGetDailyMission, completeMission } from './js/mission.js';
    import { assignOrGetDailyQuiz, submitQuizAnswer } from './js/quiz.js';
    import { getTodayEntries, addEntry } from './js/guestbook.js';

    // ========== 초기화 ==========
    initAuth(async (user) => {
      guardAuth();

      if (isAdmin()) {
        document.getElementById('adminNav').style.display = 'flex';
      }

      try {
        await init();
      } catch (error) {
        console.error('초기화 실패:', error);
      }
    });

    async function init() {
      // 뽑기권 자동 지급
      try {
        await grantDailyTicketIfNeeded();
      } catch (error) {
        console.error('뽄기권 지급 실패:', error);
      }

      // UI 업데이트
      await updateUI();

      // 이벤트 리스너
      setupEventListeners();
    }

    async function updateUI() {
      // 뽑기권
      const tickets = await getTickets();
      document.getElementById('ticketCount').textContent = tickets;

      // 뽄기 버튼 상태
      const drawBtn = document.getElementById('drawBtn');
      if (tickets <= 0) {
        drawBtn.disabled = true;
        showDrawMessage('뽄기권이 없습니다. 내일 다시 시도해주세요.', 'error');
      } else {
        drawBtn.disabled = false;
      }

      // 최근 획득 카드
      const allCards = await getCollectionData();
      const owned = allCards.filter((c) => c.isOwned);
      const recent = owned.sort((a, b) => {
        const aDate = a.firstAt ? new Date(a.firstAt) : new Date(0);
        const bDate = b.firstAt ? new Date(b.firstAt) : new Date(0);
        return bDate - aDate;
      });

      if (recent.length === 0) {
        document.getElementById('recentCards').innerHTML =
          '<div class="recent-empty">아직 뽄은 카드가 없습니다</div>';
      } else {
        const html = recent
          .slice(0, 3)
          .map((card) => `<div class="recent-card-item">${renderCard(card)}</div>`)
          .join('');
        document.getElementById('recentCards').innerHTML = html;
      }

      // 오늘의 미션
      await updateMissionUI();

      // 오늘의 퀴즈
      await updateQuizUI();

      // 방명록
      await updateGuestbookUI();
    }

    // ========== 방명록 ==========
    async function updateGuestbookUI() {
      const list = document.getElementById('guestbookList');
      try {
        const entries = await getTodayEntries();
        if (entries.length === 0) {
          list.innerHTML = '<div class="mission-empty">아직 오늘 남긴 글이 없어요</div>';
          return;
        }
        list.innerHTML = entries.map((e) => {
          const time = e.createdAt?.toDate
            ? e.createdAt.toDate().toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false })
            : '';
          return `<div class="guestbook-item">
            <div class="guestbook-meta"><span class="guestbook-nickname">${escapeHtml(e.nickname)}</span><span>${time}</span></div>
            <div class="guestbook-text">${escapeHtml(e.text)}</div>
          </div>`;
        }).join('');
        list.scrollTop = list.scrollHeight;
      } catch (error) {
        console.error('방명록 로드 실패:', error);
        list.innerHTML = '<div class="mission-empty">방명록을 불러올 수 없습니다</div>';
      }
    }

    function setupGuestbook() {
      const form = document.getElementById('guestbookForm');
      const nick = document.getElementById('guestbookNick');
      const text = document.getElementById('guestbookText');
      const count = document.getElementById('guestbookCount');
      const submit = document.getElementById('guestbookSubmit');

      try { nick.value = localStorage.getItem('guestbookNick') || ''; } catch (e) { /* 저장소 사용 불가 */ }

      text.addEventListener('input', () => {
        count.textContent = `${text.value.length}/100`;
      });

      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        submit.disabled = true;
        try {
          await addEntry(nick.value, text.value);
          try { localStorage.setItem('guestbookNick', nick.value.trim()); } catch (e) { /* 무시 */ }
          text.value = '';
          count.textContent = '0/100';
          await updateGuestbookUI();
        } catch (error) {
          console.error('방명록 작성 실패:', error);
          alert(error.message || '글을 남기지 못했어요.');
        } finally {
          submit.disabled = false;
        }
      });
    }

    async function updateQuizUI() {
      const quizSection = document.getElementById('quizSection');
      try {
        const result = await assignOrGetDailyQuiz();

        if (result.noQuizzes) {
          quizSection.innerHTML = '<div class="mission-empty">등록된 퀴즈가 없어요</div>';
          return;
        }

        renderQuiz(result.quiz, result.answered, result.selected);
      } catch (error) {
        console.error('퀴즈 로드 실패:', error);
        quizSection.innerHTML = '<div class="mission-empty">퀴즈를 불러올 수 없습니다</div>';
      }
    }

    function renderQuiz(quiz, answered, selected) {
      const quizSection = document.getElementById('quizSection');
      const choicesHtml = quiz.choices
        .map((choice, i) => {
          let cls = 'quiz-choice-btn';
          if (answered) {
            if (i === quiz.answerIndex) cls += ' correct';
            else if (i === selected) cls += ' wrong';
          }
          return `<button class="${cls}" data-index="${i}" ${answered ? 'disabled' : ''}>${i + 1}. ${escapeHtml(choice)}</button>`;
        })
        .join('');

      let resultHtml = '';
      if (answered) {
        const isCorrect = selected === quiz.answerIndex;
        resultHtml = `
          <div class="quiz-result">
            <strong class="${isCorrect ? 'ok' : 'no'}">${isCorrect ? '정답이에요! 🎉' : '아쉬워요, 오답이에요'}</strong>
            ${quiz.explanation ? `<div>${escapeHtml(quiz.explanation)}</div>` : ''}
          </div>`;
      }

      quizSection.innerHTML = `
        <div class="quiz-question">${escapeHtml(quiz.question)}</div>
        <div class="quiz-choices">${choicesHtml}</div>
        ${resultHtml}
      `;

      if (!answered) {
        quizSection.querySelectorAll('.quiz-choice-btn').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const index = parseInt(btn.dataset.index);
            quizSection.querySelectorAll('.quiz-choice-btn').forEach((b) => (b.disabled = true));
            try {
              await submitQuizAnswer(index);
              renderQuiz(quiz, true, index);
            } catch (error) {
              console.error('퀴즈 제출 실패:', error);
              alert('답 제출에 실패했습니다: ' + error.message);
              quizSection.querySelectorAll('.quiz-choice-btn').forEach((b) => (b.disabled = false));
            }
          });
        });
      }
    }

    async function updateMissionUI() {
      try {
        const missionResult = await assignOrGetDailyMission();
        const missionSection = document.getElementById('missionSection');

        if (missionResult.noMissions) {
          missionSection.innerHTML =
            '<div class="mission-empty"><div style="padding: 20px;">등록된 미션이 없어요</div></div>';
          return;
        }

        const { mission, done } = missionResult;

        if (!mission) {
          missionSection.innerHTML =
            '<div class="mission-empty"><div style="padding: 20px;">오류가 발생했습니다</div></div>';
          return;
        }

        const html = `
          <div class="mission-content">
            <div class="mission-text">${escapeHtml(mission.text)}</div>
            <button
              class="mission-button"
              id="missionBtn"
              onclick="completeMissionHandle()"
              ${done ? 'disabled' : ''}
            >
              ${done ? '<span class="mission-completed"><span class="checkmark"></span>완료함</span>' : '완료'}
            </button>
          </div>
        `;

        missionSection.innerHTML = html;
        missionSection.classList.remove('mission-empty');
        missionSection.classList.add('mission-content');
      } catch (error) {
        console.error('미션 로드 실패:', error);
        document.getElementById('missionSection').innerHTML =
          '<div class="mission-empty"><div style="padding: 20px;">미션을 불러올 수 없습니다</div></div>';
      }
    }

    function setupEventListeners() {
      setupGuestbook();

      document.getElementById('drawBtn').addEventListener('click', async () => {
        try {
          window.location.href = './draw.html';
        } catch (error) {
          showDrawMessage('오류가 발생했습니다: ' + error.message, 'error');
        }
      });

      document.getElementById('logoutBtn').addEventListener('click', async () => {
        try {
          await logout();
          window.location.href = './login.html';
        } catch (error) {
          alert('로그아웃 실패: ' + error.message);
        }
      });
    }

    function showDrawMessage(text, type) {
      const elem = document.getElementById('drawMessage');
      elem.textContent = text;
      elem.className = `draw-message show`;
      if (type === 'error') {
        elem.style.background = 'rgba(214, 48, 49, 0.1)';
        elem.style.color = 'var(--error)';
        elem.style.borderColor = 'var(--error)';
      } else {
        elem.style.background = 'rgba(107, 158, 61, 0.1)';
        elem.style.color = 'var(--grass-green)';
        elem.style.borderColor = 'var(--grass-green)';
      }
      setTimeout(() => {
        elem.classList.remove('show');
      }, 5000);
    }

    window.completeMissionHandle = async function () {
      try {
        const btn = document.getElementById('missionBtn');
        btn.disabled = true;

        await completeMission();

        // UI 업데이트
        btn.innerHTML = '<span class="mission-completed"><span class="checkmark"></span>완료함</span>';
      } catch (error) {
        console.error('미션 완료 실패:', error);
        alert('미션 완료에 실패했습니다: ' + error.message);
      }
    };

    window.goMinigame = function () {
      window.location.href = './minigame.html';
    };

    function escapeHtml(str) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;',
      };
      return String(str).replace(/[&<>"']/g, (c) => map[c]);
    }
  </script>
<script src="./js/audio.js"></script>
</body>
</html>
