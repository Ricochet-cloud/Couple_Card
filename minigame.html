<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>미니게임 - 추억카드뽑기</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/minigame.css">
  <link rel="stylesheet" href="./css/audio.css">
</head>
<body>
  <div class="main-container">
    <header class="header">
      <h1>추억카드뽑기</h1>
      <button id="logoutBtn" class="logout-btn">로그아웃</button>
    </header>

    <main>
      <div class="minigame-container">
        <div class="minigame-title">🎮 사천성</div>
        <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 8px; text-align: center; font-family: 'Galmuri';">
          첫 카드를 누르면 2분이 시작돼요. 다 없애면 새 판이 채워져요!
        </div>

        <!-- 에러 메시지 -->
        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <!-- 사천성 게임 -->
        <div class="sichuan-game">
          <div class="sichuan-hud">
            <div class="sichuan-box">남은 쌍<b id="sichuan-pairsLeft">24</b></div>
            <div class="sichuan-box">시간<b id="sichuan-timeText">02:00</b></div>
            <div class="sichuan-box">시도<b id="sichuan-movesText">0</b></div>
          </div>

          <div class="sichuan-board-wrap">
            <div class="sichuan-board" id="sichuan-board"></div>
            <svg id="sichuan-lines"></svg>
          </div>

          <div class="sichuan-controls">
            <button class="sichuan-btn" id="sichuan-hintBtn">💡 힌트</button>
            <button class="sichuan-btn" id="sichuan-shuffleBtn">🔀 섞기</button>
            <button class="sichuan-btn sichuan-btn-sub" id="sichuan-restartBtn">↻ 다시</button>
          </div>
          <button class="sichuan-btn sichuan-btn-sub" id="devClearBtn" style="display: none;">
            (개발) 즉시 종료
          </button>
        </div>

        <!-- 토스트 -->
        <div id="sichuan-toast" class="sichuan-toast"></div>

        <!-- 클리어 모달 -->
        <div class="sichuan-modal" id="sichuan-modal">
          <div class="sichuan-card">
            <h2>⏰ 시간 종료!</h2>
            <p class="sichuan-stats" id="sichuan-stats"></p>
            <p class="sichuan-reward" id="sichuan-rewardMsg"></p>
            <button class="sichuan-btn" id="sichuan-againBtn">한 판 더</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 하단 탭 네비 -->
  <nav class="bottom-nav">
    <a href="./index.html" class="nav-item" data-page="home">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">홈</span>
    </a>
    <a href="./collection.html" class="nav-item" data-page="collection">
      <span class="nav-icon">📖</span>
      <span class="nav-label">도감</span>
    </a>
    <a href="./recombine.html" class="nav-item" data-page="recombine">
      <span class="nav-icon">✨</span>
      <span class="nav-label">재조합</span>
    </a>
    <a href="./achievements.html" class="nav-item" data-page="achievements">
      <span class="nav-icon">🏆</span>
      <span class="nav-label">도전과제</span>
    </a>
    <a href="./admin.html" class="nav-item" id="adminNav" style="display: none;" data-page="admin">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">관리</span>
    </a>
  </nav>

  <script type="module">
    import { initAuth, isAdmin, logout } from './js/auth.js';
    import { guardAuth } from './js/auth.js';
    import { grantMinigameReward, SichuanGame } from './js/minigame.js';

    // ========== 초기화 ==========
    initAuth(async (user) => {
      guardAuth();

      if (isAdmin()) {
        document.getElementById('adminNav').style.display = 'flex';
      }

      try {
        await init();
      } catch (error) {
        console.error('초기화 실패:', error);
      }
    });

    async function init() {
      try {
        // 게임 시작
        SichuanGame.startGame(SichuanGame.defaultCards());

        // 시간 종료 시 보상 처리 (기준 점수 이상일 때만 호출됨)
        SichuanGame.setOnClear(async (result) => {
          try {
            const rewardResult = await grantMinigameReward('sichuan');
            return rewardResult.message;
          } catch (error) {
            console.error('보상 지급 오류:', error);
            return '보상 처리 중 오류가 났어요. 다시 시도해 주세요.';
          }
        });

        // 이벤트 리스너 추가
        SichuanGame.attachEventListeners();

        // 개발 모드: ?dev=1 일 때 즉시 클리어 버튼 표시
        if (/[?&]dev=1/.test(location.search)) {
          const devBtn = document.getElementById('devClearBtn');
          if (devBtn) {
            devBtn.style.display = 'block';
            devBtn.addEventListener('click', () => {
              // 실제 종료 처리: 점수 계산 + 보상 지급까지 진행 (점수 기록만 dev 모드라 저장 안 함)
              SichuanGame.devClear();
            });
          }
        }
      } catch (error) {
        showError('오류가 발생했습니다: ' + error.message);
      }
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try {
        await logout();
        window.location.href = './login.html';
      } catch (error) {
        alert('로그아웃 실패: ' + error.message);
      }
    });

    function showError(message) {
      const errorElem = document.getElementById('errorMessage');
      errorElem.textContent = message;
      errorElem.style.display = 'block';
    }
  </script>
</body>
</html>
